[package]
name = "aps-api"
description = "TriagePay HTTP API over the prepaid ledger core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aps-core = { path = "../core" }
aps-payment = { path = "../payment" }
aps-near = { path = "../near-adapter" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# x402 headers carry base64-encoded JSON (already in the tree via aps-near).
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
