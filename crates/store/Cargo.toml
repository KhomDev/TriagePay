[package]
name = "aps-store"
description = "TriagePay durable ledger: an append-only, hash-chained SQLite event journal replayed into aps-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aps-core = { path = "../core" }
# Pinned exactly: the journal format and the on-disk database depend on them.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
