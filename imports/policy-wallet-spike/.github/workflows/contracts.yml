# Linux CI for the policy-wallet spike: format, lint, unit and property
# tests, wasm builds with printed SHA-256, and the near-workspaces sandbox
# tests (which cannot run on Windows hosts).
name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_NEAR_VERSION: "0.21.1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Install cargo-near
        run: |
          cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked
          cargo near --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build policy-wallet wasm
        working-directory: contracts/policy-wallet
        run: cargo near build non-reproducible-wasm --locked --no-abi

      - name: Build test-token wasm
        working-directory: contracts/test-token
        run: cargo near build non-reproducible-wasm --locked --no-abi

      - name: Print wasm size and SHA-256
        run: |
          for f in target/near/policy_wallet/policy_wallet.wasm target/near/test_token/test_token.wasm; do
            echo "$f $(stat -c %s "$f") bytes"
            sha256sum "$f"
          done

      # The sandbox tests are ignored only on Windows, so on Linux this runs
      # them; the near-workspaces build script fetches the sandbox binary.
      - name: Unit, property and sandbox tests
        run: cargo test --workspace
