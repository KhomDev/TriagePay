name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
  rust-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit dependencies
        run: cargo audit
  scanner:
    name: Scanner tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install pytest ruff
      - name: Lint
        run: python -m ruff check scanner knowledge-compiler
      - name: Scanner tests
        working-directory: scanner
        run: python -m pytest -q
      - name: Knowledge-compiler tests
        working-directory: knowledge-compiler
        run: python -m pytest -q
      - name: Committed ruleset is byte-stable
        run: python -m knowledge_compiler compile --source knowledge-compiler/samples/synthetic --out scanner/rulesets/rules-v0.synthetic.1.json --check
        working-directory: knowledge-compiler
  voice:
    name: Documentation voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice check self-test
        run: python scripts/voice-check.py --self-test
      - name: No first-person plural in tracked Markdown
        run: python scripts/voice-check.py
  openapi:
    name: OpenAPI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Conformance tests
        run: python -m pytest tests -q
