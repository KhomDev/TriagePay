name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: policy-core coverage
        run: |
          cargo llvm-cov -p policy-core --all-targets --fail-under-lines 95 --summary-only | tee policy-core-cov.txt
          {
            echo "### policy-core coverage"
            echo '```'
            cat policy-core-cov.txt
            echo '```'
            echo
            echo "Line floor: 95%."
          } >> "$GITHUB_STEP_SUMMARY"
  rust-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.23.0
      - name: Audit dependencies
        run: cargo audit
  scanner:
    name: Scanner tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install pytest==9.1.1 ruff==0.17.3
      - name: Lint
        run: python -m ruff check scanner knowledge-compiler triage-model
      - name: Scanner tests
        working-directory: scanner
        run: python -m pytest -q
      - name: Knowledge-compiler tests
        working-directory: knowledge-compiler
        run: python -m pytest -q
      - name: Triage-model tests (offline; no live model calls in CI)
        working-directory: triage-model
        run: python -m pytest -q
      - name: Committed rulesets are byte-stable
        run: python -m knowledge_compiler compile --check
        working-directory: knowledge-compiler
  voice:
    name: Documentation voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Voice check self-test
        run: python scripts/voice-check.py --self-test
      - name: No first-person plural in tracked Markdown
        run: python scripts/voice-check.py
  openapi:
    name: OpenAPI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Conformance tests
        run: python -m pytest tests -q
      - name: UI tests (static checks; browser-hash parity with the runner's Node)
        run: python -m pytest ui/tests -q
  live-demo:
    name: Hosted demo and SDK unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Risk check, attacks, cooldown
        working-directory: demo/live
        run: |
          npm ci
          npx c8 --include=lib/policy-nl.js --check-coverage --lines 90 --reporter=text --reporter=text-summary node --test test/*.test.js | tee policy-nl-cov.txt
          {
            echo "### policy sentence parser coverage"
            echo '```'
            cat policy-nl-cov.txt
            echo '```'
            echo
            echo "Line floor for lib/policy-nl.js: 90%."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Policy-wallet SDK
        working-directory: packages/triagepay-sdk
        run: |
          npm ci
          npm run lint
          npm run coverage | tee sdk-cov.txt
          {
            echo "### triagepay-sdk coverage"
            echo '```'
            cat sdk-cov.txt
            echo '```'
            echo
            echo "Line, statement, and function floor: 90%."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mainnet watch script
        run: node --test scripts/mainnet/live-check.test.mjs scripts/mainnet/budget.test.mjs examples/examples.test.mjs
