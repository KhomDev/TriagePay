# Linux CI for the policy-wallet contracts workspace (`contracts/`): format,
# lint, unit tests, wasm builds with printed size and SHA-256, and the
# near-workspaces sandbox tests (which cannot run on Windows hosts).
# `crates/policy-core` belongs to the root workspace and is covered by
# ci.yml; it is rebuilt here as a path dependency of the contract.
name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "crates/policy-core/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "crates/policy-core/**"
      - ".github/workflows/contracts.yml"
  # Path filters have nothing to compare against on the first push to an
  # empty repository, so the workflow can also be started by hand.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_NEAR_VERSION: "0.21.1"

defaults:
  run:
    working-directory: contracts

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      # cargo-near builds hidapi (hardware-wallet support), whose Linux
      # build script needs the libudev headers and pkg-config.
      - name: Install cargo-near
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libudev-dev pkg-config libssl-dev binaryen
          cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked
          cargo near --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Unit tests only. The sandbox runs the wasm, which llvm-cov does not
      # instrument; the line floor is the rlib (policy-wallet and test-token).
      - name: Unit-test coverage
        run: |
          cargo llvm-cov -p policy-wallet -p test-token --lib --fail-under-lines 90 --summary-only | tee wallet-cov.txt
          {
            echo "### policy-wallet and test-token coverage"
            echo '```'
            cat wallet-cov.txt
            echo '```'
            echo
            echo "Line floor: 90% (measured 95% lines across the wallet, its tests, and the test token)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Panic locations embed source paths. Remap the cargo home, the rustup
      # home and the checkout so no runner path reaches the deployed code
      # (docs/contracts/build.md, "Host paths in the wasm").
      - name: Path remapping flags
        run: |
          echo "WASM_RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=/usr/local/cargo=/cargo --remap-path-prefix=/usr/local/rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      - name: Build policy-wallet wasm
        working-directory: contracts/policy-wallet
        run: cargo near build non-reproducible-wasm --locked --no-abi --env "RUSTFLAGS=$WASM_RUSTFLAGS"

      - name: Build test-token wasm
        working-directory: contracts/test-token
        run: cargo near build non-reproducible-wasm --locked --no-abi --env "RUSTFLAGS=$WASM_RUSTFLAGS"

      - name: Print wasm size and SHA-256, and check for host paths
        run: |
          for f in target/near/policy_wallet/policy_wallet.wasm target/near/test_token/test_token.wasm; do
            echo "$f $(stat -c %s "$f") bytes"
            sha256sum "$f"
            if grep -a -q -e "$HOME" -e "/home/" "$f"; then
              echo "host path embedded in $f"
              exit 1
            fi
          done

      - name: Use wasm-opt 108
        run: |
          if ! wasm-opt --version 2>/dev/null | grep -q "version 108"; then
            curl -fsSL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_108/binaryen-version_108-x86_64-linux.tar.gz
            tar -xzf /tmp/binaryen.tgz -C /tmp
            echo "/tmp/binaryen-version_108/bin" >> "$GITHUB_PATH"
          fi

      # Rebuild the wallet and reject a host path. The byte hash is not
      # identical across machines after path remapping; see docs/contracts/build.md.
      # Remap the cargo home,
      # the rustup home, /usr/local/cargo, /usr/local/rustup, and this
      # contracts directory. Remapping the repository root instead changes
      # the panic paths and the hash.
      - name: Check the embedded wallet wasm
        run: |
          REG_FLAGS=""
          for dir in "${CARGO_HOME:-$HOME/.cargo}"/registry/src/index.crates.io-*; do
            if [ -d "$dir" ]; then
              REG_FLAGS="$REG_FLAGS --remap-path-prefix=${dir}=/cargo/registry/src"
            fi
          done
          # The registry remap must be last: rustc keeps the last matching prefix.
          RUSTFLAGS="--cfg near --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=/usr/local/cargo=/cargo --remap-path-prefix=/usr/local/rustup=/rustup --remap-path-prefix=$PWD=/src ${REG_FLAGS}" \
            cargo build -p policy-wallet --target wasm32-unknown-unknown --release --locked
          wasm-opt --version
          wasm-opt -Oz --strip-debug --strip-producers --enable-bulk-memory \
            --enable-nontrapping-float-to-int --enable-sign-ext \
            target/wasm32-unknown-unknown/release/policy_wallet.wasm -o /tmp/policy_wallet.wasm
          python3 - <<'PY'
          import hashlib, pathlib, zlib
          wasm = pathlib.Path("/tmp/policy_wallet.wasm").read_bytes()
          digest = hashlib.sha256(wasm).hexdigest()
          # Same flags on two machines still disagree in non-path bytes
          # (221,884 bytes both times: GitHub 48562c55…, the build host
          # 17acbefc…). Fail only when a host path survives.
          for needle in (b"/usr/local/cargo", b"/usr/local/rustup", b"/home/", b"/Users/", b"index.crates.io-"):
              if needle in wasm:
                  raise SystemExit(f"host path {needle!r} in rebuilt wallet wasm")
          blob = zlib.decompress(pathlib.Path("wallet-factory/res/policy_wallet.wasm.zlib").read_bytes())
          print(f"rebuilt {len(wasm)} {digest}")
          print(f"committed {len(blob)} {hashlib.sha256(blob).hexdigest()}")
          if abs(len(wasm) - len(blob)) > 2000:
              raise SystemExit("rebuilt wallet size drifted from the committed blob")
          PY

      # The factory sandbox reads the wasm32 release artifacts. The embedded
      # wallet bytes are the committed zlib; wallet-factory's unit test checks
      # they inflate to WALLET_CODE_LEN and WALLET_CODE_SHA256.
      - name: Build factory and test-token wasm for the sandbox
        run: RUSTFLAGS="--cfg near $WASM_RUSTFLAGS" cargo build -p wallet-factory -p test-token --target wasm32-unknown-unknown --release --locked

      # The sandbox tests are ignored only on Windows, so on Linux this runs
      # them; the near-workspaces build script fetches the sandbox binary.
      - name: Unit and sandbox tests
        run: cargo test --workspace
