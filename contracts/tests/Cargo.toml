[package]
name = "sandbox-tests"
description = "near-workspaces sandbox integration tests for the policy wallet (run on Linux CI; compile-only on Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.93"
publish = false

[[test]]
name = "sandbox"
path = "sandbox.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

# near-sandbox ships binaries for Linux x86_64, Linux aarch64 and macOS
# arm64 only. Off Windows the default `install` feature fetches the sandbox
# binary at build time. On Windows the crate is built without it, so the
# tests still type-check there and are reported as ignored.
[target.'cfg(not(windows))'.dev-dependencies]
near-workspaces = "=0.23.0"

[target.'cfg(windows)'.dev-dependencies]
near-workspaces = { version = "=0.23.0", default-features = false, features = ["rustls"] }
