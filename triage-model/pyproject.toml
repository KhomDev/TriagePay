[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-triage-model"
version = "0.1.0"
description = "Stage B advisory model judge for the aps triage engine (OpenAI-compatible, stdlib only)"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["triage_model", "aps_scanner"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
