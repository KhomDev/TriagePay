[workspace]
resolver = "2"
members = ["policy-core", "contracts/policy-wallet", "contracts/test-token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Contract release profile. `overflow-checks = true` keeps arithmetic
# panics on in the deployed wasm as a second line of defence behind the
# checked math in policy-core.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
