# Local run of the TriagePay API container.
#
#   docker compose up --build -d
#   docker compose exec -T aps python3 - < deploy/smoke.py
#
# The port is published on loopback only. Until the wave-2 APS_BIND change
# lands, the API binds 127.0.0.1 inside the container, so the published
# port does not answer yet; use the in-container smoke test above.
services:
  aps:
    build: .
    image: triagepay:local
    container_name: aps
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APS_PORT: "8080"
      APS_BIND: "0.0.0.0"
      APS_DB_PATH: /data/aps.sqlite
      # Testnet only. The NEAR provider additionally needs NEAR_NETWORK,
      # NEAR_GATEWAY_ACCOUNT and NEAR_ASSET_CONTRACT; without them the
      # deterministic mock provider is used.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - aps-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

volumes:
  aps-data: {}
